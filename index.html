<head>

    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a84ff'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>💬</text></svg>">
    
    <title>ICQ-чат</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            margin: 0; padding: 0;
            font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #1a1a1e;
            overflow: hidden;
            color: #e5e5ea;
            -webkit-overflow-scrolling: touch;
        }
        body { display: flex; flex-direction: column; }
        
        :root {
            --bg-primary: #1a1a1e;
            --bg-secondary: #2c2c30;
            --bg-panel: #242428;
            --bg-input: #1c1c20;
            --bg-hover: #33333a;
            --bg-active: #3a3a44;
            --border-color: #3a3a40;
            --text-primary: #e5e5ea;
            --text-secondary: #8e8e93;
            --text-muted: #636366;
            --accent: #0a84ff;
            --accent-hover: #0070e0;
            --success: #30d158;
            --danger: #ff453a;
            --shadow: rgba(0,0,0,0.3);
            --bubble-mine: #0a84ff;
            --bubble-other: #2c2c30;
            --modal-bg: rgba(0,0,0,0.7);
            --tab-bg: #1f1f23;
            --skeleton-bg: #2c2c30;
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        }
        [data-theme="light"] {
            --bg-primary: #f0f0f2;
            --bg-secondary: #ffffff;
            --bg-panel: #f8f8fa;
            --bg-input: #ffffff;
            --bg-hover: #e5e5ea;
            --bg-active: #d1d1d6;
            --border-color: #c6c6c8;
            --text-primary: #1c1c1e;
            --text-secondary: #3a3a3c;
            --text-muted: #8e8e93;
            --accent: #007aff;
            --accent-hover: #0055cc;
            --shadow: rgba(0,0,0,0.1);
            --bubble-mine: #007aff;
            --bubble-other: #e5e5ea;
            --modal-bg: rgba(0,0,0,0.5);
            --tab-bg: #f0f0f2;
            --skeleton-bg: #e5e5ea;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
        
        .chat-app { display: flex; flex-direction: column; width: 100%; height: 100vh; height: 100dvh; background: var(--bg-secondary); overflow: hidden; position: relative; }
        
        .top-bar { display: flex; align-items: center; padding: 8px 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); flex-shrink: 0; gap: 12px; min-height: 56px; padding-top: calc(8px + var(--safe-area-top)); }
        .top-bar .profile-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; cursor: pointer; overflow: hidden; background-size: cover; background-position: center; flex-shrink: 0; }
        .top-bar .profile-icon:hover { transform: scale(1.05); }
        .top-bar .app-title { font-weight: 700; font-size: 18px; color: var(--text-primary); flex: 1; }
        .top-bar .app-title span { font-weight: 400; font-size: 14px; color: var(--text-secondary); }
        .top-bar .shortcuts-hint { font-size: 11px; color: var(--text-muted); padding: 4px 10px; background: var(--bg-hover); border-radius: 12px; display: none; cursor: default; }
        @media (min-width: 1024px) { .top-bar .shortcuts-hint { display: block; } }

        .main-content { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { width: 72px; background: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 12px 0; flex-shrink: 0; gap: 4px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .sidebar .sidebar-btn { width: 48px; height: 48px; border-radius: 12px; border: none; background: transparent; color: var(--text-secondary); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; position: relative; min-height: 44px; min-width: 44px; }
        .sidebar .sidebar-btn:hover { background: var(--bg-hover); color: var(--text-primary); transform: scale(1.05); }
        .sidebar .sidebar-btn.active { background: var(--bg-active); color: var(--accent); }
        .sidebar .sidebar-btn .badge { position: absolute; top: 2px; right: 2px; background: var(--danger); color: #fff; font-size: 10px; border-radius: 50%; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-weight: 700; padding: 0 4px; }
        .sidebar .divider { width: 32px; height: 1px; background: var(--border-color); margin: 6px 0; }

        .chat-list-panel { width: 320px; background: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
        .chat-list-panel .search-bar { padding: 10px 14px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; position: relative; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .chat-list-panel .search-bar input { flex: 1; padding: 8px 14px 8px 38px; border: 1px solid var(--border-color); border-radius: 20px; font-size: 14px; outline: none; background: var(--bg-input); color: var(--text-primary); min-width: 100px; -webkit-appearance: none; }
        .chat-list-panel .search-bar input:focus { border-color: var(--accent); }
        .chat-list-panel .search-bar input::placeholder { color: var(--text-muted); }
        .chat-list-panel .search-bar .search-icon { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 16px; }
        .chat-list-panel .search-bar .search-filter { background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 20px; padding: 4px 10px; font-size: 12px; min-height: 36px; cursor: pointer; flex-shrink: 0; -webkit-appearance: auto; }
        .chat-list-panel .search-bar .search-filter:focus { border-color: var(--accent); outline: none; }
        .chat-list-panel .search-bar .search-filter option { background: var(--bg-panel); color: var(--text-primary); }
        .chat-list-panel .search-bar .create-group-btn { background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; min-height: 36px; }
        .chat-list-panel .search-bar .create-group-btn:hover { background: var(--accent-hover); }
        .chat-list-panel .folder-tabs { display: flex; padding: 4px 14px; gap: 4px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .chat-list-panel .folder-tabs .folder-btn { padding: 6px 14px; border: none; background: transparent; color: var(--text-secondary); font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 12px; white-space: nowrap; min-height: 36px; flex-shrink: 0; }
        .chat-list-panel .folder-tabs .folder-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .chat-list-panel .folder-tabs .folder-btn.active { background: var(--bg-active); color: var(--accent); }
        .chat-list-panel .chat-list { flex: 1; overflow-y: auto; padding: 4px 0; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
        .chat-list-panel .chat-list .skeleton-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; animation: shimmer 1.5s infinite; }
        .chat-list-panel .chat-list .skeleton-item .skeleton-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--skeleton-bg); flex-shrink: 0; }
        .chat-list-panel .chat-list .skeleton-item .skeleton-text { flex: 1; height: 12px; background: var(--skeleton-bg); border-radius: 6px; }
        .chat-list-panel .chat-list .skeleton-item .skeleton-text.short { width: 60%; }
        @keyframes shimmer { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        .chat-list-panel .chat-list .chat-item { padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-color); transition: background 0.15s; position: relative; min-height: 64px; }
        .chat-list-panel .chat-list .chat-item:hover { background: var(--bg-hover); }
        .chat-list-panel .chat-list .chat-item:active { transform: scale(0.98); }
        .chat-list-panel .chat-list .chat-item.active { background: var(--bg-active); }
        .chat-list-panel .chat-list .chat-item .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; flex-shrink: 0; overflow: hidden; position: relative; }
        .chat-list-panel .chat-list .chat-item .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .chat-list-panel .chat-list .chat-item .avatar .initials { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; background: var(--accent); }
        .chat-list-panel .chat-list .chat-item .avatar img ~ .initials { display: none; }
        .chat-list-panel .chat-list .chat-item .avatar .online-dot { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; background: #636366; border-radius: 50%; border: 2px solid var(--bg-panel); }
        .chat-list-panel .chat-list .chat-item .avatar .online-dot.online { background: var(--success); }
        .chat-list-panel .chat-list .chat-item .info { flex: 1; min-width: 0; }
        .chat-list-panel .chat-list .chat-item .info .name { font-weight: 600; font-size: 15px; color: var(--text-primary); }
        .chat-list-panel .chat-list .chat-item .info .last-msg { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .chat-list-panel .chat-list .chat-item .time { font-size: 11px; color: var(--text-muted); flex-shrink: 0; align-self: flex-start; margin-top: 4px; }
        .chat-list-panel .chat-list .chat-item .unread-badge { background: var(--danger); color: #fff; border-radius: 50%; min-width: 20px; height: 20px; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px; }

        .chat-panel { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); min-width: 0; height: 100%; position: relative; }
        .chat-panel .drop-zone { display: none; position: absolute; inset: 0; background: rgba(10,132,255,0.1); border: 3px dashed var(--accent); border-radius: 12px; align-items: center; justify-content: center; font-size: 24px; color: var(--accent); font-weight: 600; z-index: 50; backdrop-filter: blur(4px); }
        .chat-panel .drop-zone.active { display: flex; }
        .chat-panel .drop-zone .icon { font-size: 48px; margin-right: 16px; }
        .chat-panel .chat-header { padding: 10px 18px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; flex-shrink: 0; min-height: 60px; padding-top: calc(10px + var(--safe-area-top)); }
        .chat-panel .chat-header .back-btn { display: none; background: none; border: none; color: var(--accent); font-size: 24px; cursor: pointer; padding: 4px 8px; min-height: 44px; min-width: 44px; }
        .chat-panel .chat-header .back-btn:hover { background: var(--bg-hover); border-radius: 8px; }
        .chat-panel .chat-header .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0; overflow: hidden; position: relative; }
        .chat-panel .chat-header .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .chat-panel .chat-header .avatar .initials { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .chat-panel .chat-header .info { flex: 1; min-width: 0; }
        .chat-panel .chat-header .info .name { font-weight: 600; font-size: 17px; color: var(--text-primary); }
        .chat-panel .chat-header .info .status { font-size: 12px; color: var(--text-muted); }
        .chat-panel .chat-header .info .status.online { color: var(--success); }
        .chat-panel .chat-header .actions { display: flex; gap: 4px; }
        .chat-panel .chat-header .actions button { background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; padding: 6px 8px; border-radius: 8px; min-height: 44px; min-width: 44px; }
        .chat-panel .chat-header .actions button:hover { background: var(--bg-hover); }
        .chat-panel .status-bar { text-align: center; font-size: 12px; padding: 3px 0; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); flex-shrink: 0; color: var(--text-muted); }
        .chat-panel .status-bar.error { color: var(--danger); }
        .chat-panel .status-bar.warning { color: #ffd60a; }
        .chat-panel .messages-area { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; background: var(--bg-primary); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; position: relative; }
        .chat-panel .messages-area .message-row { display: flex; gap: 10px; align-items: flex-start; max-width: 82%; position: relative; animation: messageIn 0.3s ease-out; }
        @keyframes messageIn { from { opacity: 0; transform: translateY(10px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .chat-panel .messages-area .message-row.mine { align-self: flex-end; flex-direction: row-reverse; }
        .chat-panel .messages-area .message-row .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; overflow: hidden; position: relative; cursor: pointer; }
        .chat-panel .messages-area .message-row .avatar:hover { transform: scale(1.05); }
        .chat-panel .messages-area .message-row .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .chat-panel .messages-area .message-row .avatar .initials { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; background: var(--accent); }
        .chat-panel .messages-area .message-row .avatar img ~ .initials { display: none; }
        .chat-panel .messages-area .message-row .bubble { background: var(--bubble-other); padding: 8px 14px; border-radius: 18px; word-wrap: break-word; max-width: 100%; box-shadow: 0 1px 2px var(--shadow); position: relative; color: var(--text-primary); }
        .chat-panel .messages-area .message-row.mine .bubble { background: var(--bubble-mine); color: #fff; }
        .chat-panel .messages-area .message-row.mine .bubble .sender { color: rgba(255,255,255,0.7); }
        .chat-panel .messages-area .message-row .bubble .sender { font-weight: 600; font-size: 12px; color: var(--accent); margin-bottom: 2px; }
        .chat-panel .messages-area .message-row .bubble .text { font-size: 15px; line-height: 1.4; word-wrap: break-word; overflow-wrap: break-word; }
        .chat-panel .messages-area .message-row .bubble .time-status { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 2px; }
        .chat-panel .messages-area .message-row .bubble .time { font-size: 10px; color: var(--text-muted); }
        .chat-panel .messages-area .message-row.mine .bubble .time { color: rgba(255,255,255,0.6); }
        .chat-panel .messages-area .message-row .bubble .message-status { display: inline-flex; align-items: center; gap: 1px; font-size: 14px; letter-spacing: -2px; }
        .chat-panel .messages-area .message-row .bubble .message-status .check { display: inline-block; font-size: 14px; line-height: 1; color: var(--text-muted); opacity: 0.6; }
        .chat-panel .messages-area .message-row .bubble .message-status .check.delivered { color: var(--success); opacity: 1; }
        .chat-panel .messages-area .message-row .bubble .message-status .check.read { color: var(--accent); opacity: 1; }
        .chat-panel .messages-area .message-row .bubble .message-status .check.sending { color: var(--text-muted); opacity: 0.4; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        .voice-message { display: flex; align-items: center; gap: 8px; padding: 4px 0; min-width: 200px; max-width: 350px; flex-wrap: wrap; }
        .voice-message .play-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); border: none; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
        .voice-message .play-btn:hover { transform: scale(1.05); }
        .voice-message .play-btn:active { transform: scale(0.9); }
        .voice-message .play-btn.playing { animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .voice-message .waveform { flex: 1; height: 30px; display: flex; align-items: center; gap: 2px; cursor: pointer; padding: 0 4px; min-width: 60px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .voice-message .waveform .bar { width: 3px; background: var(--text-secondary); border-radius: 2px; transition: all 0.3s ease; flex-shrink: 0; }
        .voice-message .waveform .bar.active { background: var(--accent); height: 24px !important; animation: waveActive 0.3s ease; }
        @keyframes waveActive { 0% { height: 6px; } 50% { height: 28px; } 100% { height: 24px; } }
        .voice-message .time-label { font-size: 12px; color: var(--text-muted); min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
        .voice-message .speed-btn { background: none; border: 1px solid var(--border-color); border-radius: 8px; padding: 2px 8px; font-size: 11px; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; min-height: 28px; }
        .voice-message .speed-btn:hover { background: var(--bg-hover); }
        .voice-message .speed-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(10,132,255,0.1); }
        .voice-message .download-btn { background: none; border: 1px solid var(--border-color); border-radius: 8px; padding: 2px 8px; font-size: 14px; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; min-height: 28px; }
        .voice-message .download-btn:hover { background: var(--bg-hover); }

        .link-preview { margin: 6px 0; border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; max-width: 400px; background: var(--bg-hover); cursor: pointer; transition: all 0.2s ease; }
        .link-preview:hover { transform: scale(1.01); box-shadow: 0 2px 12px var(--shadow); }
        .link-preview .preview-image { width: 100%; max-height: 200px; object-fit: cover; background: var(--bg-secondary); }
        .link-preview .preview-content { padding: 10px 14px; }
        .link-preview .preview-title { font-weight: 600; color: var(--text-primary); font-size: 15px; margin-bottom: 4px; }
        .link-preview .preview-description { font-size: 13px; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .link-preview .preview-url { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

        .reaction-popup { display: none; position: fixed; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 16px; padding: 8px 12px; box-shadow: 0 4px 20px var(--shadow); z-index: 50; animation: popUp 0.2s ease-out; }
        @keyframes popUp { from { opacity: 0; transform: scale(0.8) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .reaction-popup.active { display: flex; gap: 6px; flex-wrap: wrap; }
        .reaction-popup .reaction-option { font-size: 28px; cursor: pointer; padding: 4px 6px; border-radius: 8px; user-select: none; transition: all 0.15s; }
        .reaction-popup .reaction-option:hover { transform: scale(1.3); background: var(--bg-hover); }
        .reaction-popup .reaction-option:active { transform: scale(0.8); }
        .reaction-popup .close-reactions { font-size: 16px; cursor: pointer; padding: 4px 6px; color: var(--text-muted); align-self: center; }
        .reaction-popup .close-reactions:hover { color: var(--text-primary); }
        .reactions { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
        .reactions .reaction { background: var(--bg-hover); padding: 2px 8px; border-radius: 12px; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.2s; user-select: none; }
        .reactions .reaction:hover { transform: scale(1.1); background: var(--bg-active); }
        .reactions .reaction:active { transform: scale(0.9); }
        .reactions .reaction .count { font-size: 12px; color: var(--text-muted); }
        .reactions .reaction.reacted { background: var(--accent); color: #fff; }
        .reactions .reaction.reacted .count { color: rgba(255,255,255,0.7); }
        .reactions .reaction.reacted { animation: reactionPop 0.3s ease-out; }
        @keyframes reactionPop { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }

    function toggleReaction(key, emoji) {
        const msgData = messagesCache.find(m => m.key === key);
        if (!msgData) return;
        const ref = messagesRef.child(key);
        ref.once('value', (snap) => {
            const data = snap.val() || {};
            if (!data.reactions) data.reactions = {};
            const usersKey = emoji + '_users';
            if (!data.reactions[usersKey]) data.reactions[usersKey] = [];
            const idx = data.reactions[usersKey].indexOf(currentUserId);
            if (idx !== -1) {
                data.reactions[usersKey].splice(idx, 1);
                data.reactions[emoji] = (data.reactions[emoji] || 1) - 1;
                if (data.reactions[emoji] <= 0) { delete data.reactions[emoji]; delete data.reactions[usersKey]; }
            } else {
                data.reactions[usersKey].push(currentUserId);
                data.reactions[emoji] = (data.reactions[emoji] || 0) + 1;
            }
            ref.update({ reactions: data.reactions });
        });
    }

    // ============================================================
    // ГОЛОСОВЫЕ СООБЩЕНИЯ
    // ============================================================
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let recordingStartTime = null;
    let recordingTimer = null;
    let recordingDuration = 0;

    voiceBtn.addEventListener('click', () => { if (isRecording) stopRecording(); else startRecording(); });

    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
            let mimeType = 'audio/webm';
            if (!MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/ogg';
            if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/mp4';
            mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType, audioBitsPerSecond: 128000 });
            audioChunks = [];
            recordingStartTime = Date.now();
            recordingDuration = 0;
            mediaRecorder.ondataavailable = event => { if (event.data.size > 0) audioChunks.push(event.data); };
            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: mimeType });
                const file = new File([audioBlob], 'voice.' + mimeType.split('/')[1], { type: mimeType });
                sendVoiceMessage(file, recordingDuration);
                stream.getTracks().forEach(track => track.stop());
                isRecording = false;
                voiceBtn.textContent = '🎤';
                voiceBtn.classList.remove('recording');
                if (recordingTimer) { clearInterval(recordingTimer); recordingTimer = null; }
                statusDiv.textContent = '✅ Голосовое записано';
                statusDiv.className = 'status-bar';
            };
            mediaRecorder.start(1000);
            isRecording = true;
            voiceBtn.textContent = '⏹️';
            voiceBtn.classList.add('recording');
            recordingTimer = setInterval(() => {
                recordingDuration = Math.floor((Date.now() - recordingStartTime) / 1000);
                const mins = String(Math.floor(recordingDuration / 60)).padStart(2, '0');
                const secs = String(recordingDuration % 60).padStart(2, '0');
                statusDiv.textContent = '🎤 Запись... ' + mins + ':' + secs;
                statusDiv.className = 'status-bar warning';
            }, 500);
            showToast('🎤 Запись... Нажмите ещё раз для отправки');
        } catch(err) {
            alert('Не удалось получить доступ к микрофону');
            isRecording = false;
            voiceBtn.textContent = '🎤';
            voiceBtn.classList.remove('recording');
        }
    }
    function stopRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            voiceBtn.textContent = '⏳';
            voiceBtn.classList.remove('recording');
            if (recordingTimer) { clearInterval(recordingTimer); recordingTimer = null; }
            showToast('⏳ Обработка...');
        }
    }
    async function sendVoiceMessage(file, duration) {
        if (!currentUser) return;
        if (file.size > 10 * 1024 * 1024) { showToast('❌ Максимум 10MB'); return; }
        showToast('📤 Загрузка...');
        try {
            const result = await uploadToGoFile(file);
            const to = currentContact === 'all' ? null : currentContact;
            const payload = { name: currentName, userId: currentUserId, text: result.directLink, fileName: 'Голосовое', fileSize: file.size, isFile: true, isVoice: true, duration: duration || Math.floor(file.size / 16000), to: to, timestamp: firebase.database.ServerValue.TIMESTAMP, status: 'sending' };
            if (currentGroupId) groupMessagesRef.child(currentGroupId).push(payload); else messagesRef.push(payload);
            showToast('✅ Отправлено!');
        } catch(err) { showToast('❌ Ошибка: ' + err.message); }
    }

    function createVoiceMessageElement(data) {
        const container = document.createElement('div');
        container.className = 'voice-message';
        const playBtn = document.createElement('button');
        playBtn.className = 'play-btn';
        playBtn.textContent = '▶';
        const waveform = document.createElement('div');
        waveform.className = 'waveform';
        const bars = [];
        for (let i = 0; i < 40; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = (6 + Math.random() * 20) + 'px';
            waveform.appendChild(bar);
            bars.push(bar);
        }
        const timeLabel = document.createElement('span');
        timeLabel.className = 'time-label';
        const duration = data.duration || 30;
        timeLabel.textContent = String(Math.floor(duration / 60)).padStart(2, '0') + ':' + String(Math.floor(duration % 60)).padStart(2, '0');
        
        let audio = null, isPlaying = false, progressInterval = null;
        playBtn.onclick = async () => {
            if (!audio) {
                audio = new Audio(data.text);
                audio.onloadedmetadata = () => { timeLabel.dataset.duration = audio.duration; };
                audio.onended = () => { isPlaying = false; playBtn.textContent = '▶'; clearInterval(progressInterval); bars.forEach(b => b.classList.remove('active')); };
                audio.ontimeupdate = () => {
                    if (audio.duration) {
                        const progress = audio.currentTime / audio.duration;
                        bars.forEach((b, i) => b.classList.toggle('active', i < progress * bars.length));
                    }
                };
            }
            if (isPlaying) { audio.pause(); playBtn.textContent = '▶'; clearInterval(progressInterval); }
            else { await audio.play(); playBtn.textContent = '⏸'; progressInterval = setInterval(() => { if(audio.paused) playBtn.textContent='▶'; }, 500); }
            isPlaying = !isPlaying;
        };
        container.appendChild(playBtn);
        container.appendChild(waveform);
        container.appendChild(timeLabel);
        return container;
    }

    // ============================================================
    // ЛОГИКА СООБЩЕНИЙ
    // ============================================================
    function isMessageRelevant(data) {
        const isPrivate = data.to && data.to !== '';
        if (currentContact === 'all') return !isPrivate;
        else if (currentContact.startsWith('group_')) return true;
        else {
            const isFromMe = data.name === currentName;
            const isFromContact = data.name === currentContact;
            const isToMe = data.to === currentName;
            const isToContact = data.to === currentContact;
            if (isFromMe && isToContact) return true;
            if (isFromContact && isToMe) return true;
            return false;
        }
    }

    function listenMessages() {
        if (!currentName || !currentUserId || messageListenerStarted) return;
        messageListenerStarted = true;
        messagesRef.limitToLast(100).once('value', (snapshot) => {
            const items = [];
            snapshot.forEach((child) => items.push({ key: child.key, ...child.val() }));
            items.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            items.forEach(item => { if (!messageNodes[item.key]) addMessageToUI(item.key, item); });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            isAtBottom = true;
        });
        messagesRef.limitToLast(1).on('child_added', (snapshot) => {
            const data = snapshot.val();
            const key = snapshot.key;
            if (messageNodes[key] || (messagesCache.find(m => m.key === key))) return;
            addMessageToUI(key, data);
            if (data.name !== currentName) {
                showEnhancedNotification(data.name || 'Аноним', data.text || 'Файл', { contact: data.name });
            }
        });
        messagesRef.on('child_changed', (snapshot) => {
            const data = snapshot.val();
            const key = snapshot.key;
            const existing = messagesCache.find(m => m.key === key);
            if (existing) {
                Object.assign(existing, data);
                const node = messageNodes[key];
                if (node) {
                    const newRow = createMessageRow(key, data);
                    node.parentNode.replaceChild(newRow, node);
                    messageNodes[key] = newRow;
                }
            }
        });
        messagesRef.on('child_removed', (snapshot) => {
            const key = snapshot.key;
            if (messageNodes[key]) { messageNodes[key].remove(); delete messageNodes[key]; }
            const idx = messagesCache.findIndex(m => m.key === key);
            if (idx !== -1) messagesCache.splice(idx, 1);
        });
    }

    function addMessageToUI(key, data) {
        if (messagesCache.some(m => m.key === key) || messageNodes[key]) return;
        if (!isMessageRelevant(data)) return;
        if (!data.status) data.status = 'sending';
        messagesCache.push({ key, ...data });
        const row = createMessageRow(key, data);
        messagesDiv.appendChild(row);
        messageNodes[key] = row;
        if (isAtBottom) messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function createMessageRow(key, data) {
        const row = document.createElement('div');
        row.className = 'message-row' + (data.name === currentName ? ' mine' : '');
        row.dataset.key = key;
        
        const avatar = createAvatarElement(data.name || '?', getAvatarUrl(data.name), 30);
        row.appendChild(avatar);
        
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        
        if (data.name !== currentName) {
            const sender = document.createElement('div');
            sender.className = 'sender';
            sender.textContent = data.name || 'Аноним';
            bubble.appendChild(sender);
        }
        
        const textDiv = document.createElement('div');
        textDiv.className = 'text';
        if (data.isVoice && data.text) textDiv.appendChild(createVoiceMessageElement(data));
        else if (data.isFile && data.text) {
            const btn = document.createElement('button');
            btn.className = 'file-link';
            btn.textContent = '📥 Скачать "' + (data.fileName || 'файл') + '"';
            btn.onclick = () => window.open(data.text, '_blank');
            textDiv.appendChild(btn);
        } else if (data.text) {
            data.text.split('\n').forEach((line, i) => {
                if (i > 0) textDiv.appendChild(document.createElement('br'));
                textDiv.appendChild(document.createTextNode(line));
            });
        }
        
        bubble.appendChild(textDiv);
        
        const timeStatusWrap = document.createElement('div');
        timeStatusWrap.className = 'time-status';
        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = data.timestamp ? formatTime(data.timestamp) : '';
        timeStatusWrap.appendChild(time);
        if (data.name === currentName) {
            const statusSpan = document.createElement('span');
            statusSpan.className = 'message-status';
            statusSpan.innerHTML = getStatusHTML(data.status || 'sent');
            timeStatusWrap.appendChild(statusSpan);
        }
        bubble.appendChild(timeStatusWrap);
        row.appendChild(bubble);
        
        row.addEventListener('dblclick', (e) => { e.stopPropagation(); showReactionPopup(key, data, e); });
        row.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); showContextMenu(key, data); });
        
        return row;
    }

    // ============================================================

    function sendMessage(text) {
        if (!currentUser || !currentName || !currentUserId) return;
        let to = currentContact === 'all' ? null : currentContact;
        const payload = { name: currentName, userId: currentUserId, text: text || '', to: to, timestamp: firebase.database.ServerValue.TIMESTAMP, status: 'sending' };
        messagesRef.push(payload);
    }
    function sendText() {
        const text = messageInput.value.trim();
        if (!text) return;
        sendMessage(text);
        messageInput.value = '';
    }

    messageInput.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } };

    // ============================================================
    // ВХОД И АВТОРИЗАЦИЯ
    // ============================================================
    function showModal(html) {
        modalContent.innerHTML = html;
        window._modalActive = true;
        modalOverlay.classList.add('active');
    }
    function closeModal() {
        modalOverlay.classList.remove('active');
        window._modalActive = false;
    }
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

    function showLoginModal() {
        showModal(`
            <div class="modal-header"><h2>🔐 Вход</h2></div>
            <div style="display:flex;flex-direction:column;gap:12px;">
                <input type="email" id="loginEmail" placeholder="Email" class="input-field">
                <input type="password" id="loginPassword" placeholder="Пароль" class="input-field">
                <button id="loginSubmitBtn" class="btn-primary">Войти</button>
                <button id="registerSubmitBtn" class="btn-primary" style="background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border-color);">Регистрация</button>
            </div>
        `);
        
        document.getElementById('loginSubmitBtn').onclick = async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            if (!email || !pass) return showToast('❌ Введите данные');
            try {
                await auth.signInWithEmailAndPassword(email, pass);
                closeModal();
                showToast('✅ Добро пожаловать!');
            } catch (err) { showToast('❌ Ошибка: ' + err.message); }
        };
        
        document.getElementById('registerSubmitBtn').onclick = async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            if (!email || pass.length < 6) return showToast('❌ Пароль минимум 6 символов');
            try {
                const cred = await auth.createUserWithEmailAndPassword(email, pass);
                await usersRef.child(cred.user.uid).set({ name: email.split('@')[0], userId: generateUserId() });
                closeModal();
                showToast('✅ Успешно!');
            } catch (err) { showToast('❌ Ошибка: ' + err.message); }
        };
    }

    document.getElementById('logoutSidebarBtn').addEventListener('click', () => {
        if (confirm('Выйти?')) auth.signOut();
    });

    auth.onAuthStateChanged(user => {
        if (user) {
            closeModal();
            currentUser = user;
            usersRef.child(user.uid).once('value').then(snap => {
                const data = snap.val() || {};
                currentName = data.name || user.email.split('@')[0];
                currentUserId = data.userId || generateUserId();
                headerUsername.textContent = currentName;
                updateHeaderAvatar();
                messageInput.disabled = false;
                sendBtn.disabled = false;
                statusDiv.textContent = '✅ Подключено';
                statusDiv.className = 'status-bar';
                setupOnlineStatus();
                initCallListener();
                
                usersRef.child(user.uid + '/contacts').once('value').then(cSnap => {
                    contactListArray = Object.keys(cSnap.val() || {});
                    renderChatList();
                    switchContact('all');
                });
            });
        } else {
            if (onlineInterval) clearInterval(onlineInterval);
            currentUser = null;
            currentName = '';
            currentUserId = '';
            headerUsername.textContent = '—';
            myAvatar.textContent = '?';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            statusDiv.textContent = '⏳ Войдите';
            messagesDiv.innerHTML = '';
            chatList.innerHTML = '';
            showLoginModal();
        }
    });

    // ============================================================
    // ЗАПУСК И СЕРВИС-ВОРКЕР
    // ============================================================
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => console.log('SW не зарегистрирован'));
    }

    function initFCM() {
        if (!messaging) return;
        // Инициализация FCM (безопасная)
        try {
            if (Notification.permission === 'granted') {
                messaging.getToken({ vapidKey: 'BF4sSDyQPmRVrHnNK_H4taStfzVA3nxl0QynjcUB0-jUmLF5_bS1GA08ZD-D5El7uxVf3spuAYOANPE8ZmrWfMk' })
                .then(token => { if (currentUser) usersRef.child(currentUser.uid + '/fcmToken').set(token); })
                .catch(e => console.log('FCM Error:', e));
            }
        } catch(e) {}
    }

    checkNotificationPermission();
    console.log('🚀 ICQ-чат готов к работе!');
    </script>
</body>
</html>
