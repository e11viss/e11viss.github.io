    <style>
/* ============================================================
   TELEGRAM-STYLE UI
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    width: 100%; height: 100%;
    margin: 0; padding: 0;
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #0e1621;
    overflow: hidden;
    color: #f5f5f5;
    -webkit-overflow-scrolling: touch;
}
body { display: flex; flex-direction: column; }

:root {
    --bg-primary: #0e1621;
    --bg-secondary: #17212b;
    --bg-panel: #17212b;
    --bg-input: #242f3d;
    --bg-hover: #202b36;
    --bg-active: #2b5278;
    --border-color: #101921;
    --text-primary: #f5f5f5;
    --text-secondary: #7f91a4;
    --text-muted: #6c7883;
    --accent: #5288c1;
    --accent-hover: #649ad4;
    --success: #4fae4e;
    --danger: #e53935;
    --shadow: rgba(0,0,0,0.3);
    --bubble-mine: #2b5278;
    --bubble-other: #182533;
    --modal-bg: rgba(0,0,0,0.7);
    --tab-bg: #17212b;
    --skeleton-bg: #242f3d;
    --safe-area-top: env(safe-area-inset-top, 0px);
    --safe-area-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="light"] {
    --bg-primary: #e6ebee;
    --bg-secondary: #ffffff;
    --bg-panel: #ffffff;
    --bg-input: #f1f3f5;
    --bg-hover: #f5f5f5;
    --bg-active: #e3f2fd;
    --border-color: #e6e6e6;
    --text-primary: #000000;
    --text-secondary: #707579;
    --text-muted: #a8a8a8;
    --accent: #3390ec;
    --accent-hover: #2b7fd4;
    --shadow: rgba(0,0,0,0.1);
    --bubble-mine: #eeffde;
    --bubble-other: #ffffff;
    --modal-bg: rgba(0,0,0,0.5);
    --tab-bg: #ffffff;
    --skeleton-bg: #e6ebee;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(127,145,164,0.3); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(127,145,164,0.5); }

.chat-app { display: flex; flex-direction: column; width: 100%; height: 100vh; height: 100dvh; background: var(--bg-secondary); overflow: hidden; position: relative; }

/* ---------- ВЕРХНЯЯ ПАНЕЛЬ ---------- */
.top-bar { display: flex; align-items: center; padding: 8px 16px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); flex-shrink: 0; gap: 12px; min-height: 56px; padding-top: calc(8px + var(--safe-area-top)); }
.top-bar .profile-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; cursor: pointer; overflow: hidden; background-size: cover; background-position: center; flex-shrink: 0; transition: transform 0.15s; }
.top-bar .profile-icon:hover { transform: scale(1.05); }
.top-bar .app-title { font-weight: 600; font-size: 17px; color: var(--text-primary); flex: 1; }
.top-bar .app-title span { font-weight: 400; font-size: 14px; color: var(--text-secondary); }
.top-bar .shortcuts-hint { font-size: 11px; color: var(--text-muted); padding: 4px 10px; background: var(--bg-input); border-radius: 12px; display: none; }
@media (min-width: 1024px) { .top-bar .shortcuts-hint { display: block; } }

/* ---------- ОСНОВНАЯ ЗОНА ---------- */
.main-content { display: flex; flex: 1; overflow: hidden; }

/* ---------- ЛЕВЫЙ УЗКИЙ SIDEBAR ---------- */
.sidebar { width: 72px; background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 12px 0; flex-shrink: 0; gap: 4px; overflow-y: auto; }
.sidebar .sidebar-btn { width: 48px; height: 48px; border-radius: 50%; border: none; background: transparent; color: var(--text-secondary); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; position: relative; min-height: 44px; min-width: 44px; }
.sidebar .sidebar-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.sidebar .sidebar-btn.active { background: var(--bg-active); color: #fff; }
.sidebar .sidebar-btn .badge { position: absolute; top: 4px; right: 4px; background: var(--accent); color: #fff; font-size: 10px; border-radius: 10px; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-weight: 700; padding: 0 5px; }
.sidebar .divider { width: 32px; height: 1px; background: var(--border-color); margin: 6px 0; }

/* ---------- ПАНЕЛЬ СПИСКА ЧАТОВ ---------- */
.chat-list-panel { width: 340px; background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
.chat-list-panel .search-bar { padding: 8px 12px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; position: relative; display: flex; gap: 6px; align-items: center; }
.chat-list-panel .search-bar input { flex: 1; padding: 8px 14px 8px 38px; border: none; border-radius: 20px; font-size: 14px; outline: none; background: var(--bg-input); color: var(--text-primary); min-width: 100px; -webkit-appearance: none; }
.chat-list-panel .search-bar input::placeholder { color: var(--text-muted); }
.chat-list-panel .search-bar .search-icon { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 15px; }
.chat-list-panel .search-bar .search-filter { background: var(--bg-input); color: var(--text-secondary); border: none; border-radius: 20px; padding: 6px 10px; font-size: 12px; cursor: pointer; flex-shrink: 0; -webkit-appearance: auto; outline: none; }
.chat-list-panel .search-bar .search-filter option { background: var(--bg-secondary); color: var(--text-primary); }
.chat-list-panel .search-bar .create-group-btn { background: var(--accent); color: #fff; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 16px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.chat-list-panel .search-bar .create-group-btn:hover { background: var(--accent-hover); }

.chat-list-panel .folder-tabs { display: flex; padding: 4px 12px; gap: 6px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; overflow-x: auto; }
.chat-list-panel .folder-tabs .folder-btn { padding: 6px 12px; border: none; background: transparent; color: var(--text-secondary); font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 16px; white-space: nowrap; min-height: 32px; flex-shrink: 0; transition: all 0.15s; }
.chat-list-panel .folder-tabs .folder-btn:hover { color: var(--text-primary); }
.chat-list-panel .folder-tabs .folder-btn.active { background: var(--bg-active); color: #fff; }

.chat-list-panel .chat-list { flex: 1; overflow-y: auto; padding: 4px 0; -webkit-overflow-scrolling: touch; }
.chat-list-panel .chat-list .chat-item { padding: 9px 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; border: none; transition: background 0.12s; position: relative; min-height: 66px; }
.chat-list-panel .chat-list .chat-item:hover { background: var(--bg-hover); }
.chat-list-panel .chat-list .chat-item.active { background: var(--bg-active); }
.chat-list-panel .chat-list .chat-item.active .info .name,
.chat-list-panel .chat-list .chat-item.active .info .last-msg,
.chat-list-panel .chat-list .chat-item.active .time { color: #fff; }
.chat-list-panel .chat-list .chat-item.active .unread-badge { background: #fff; color: var(--bg-active); }
.chat-list-panel .chat-list .chat-item .avatar { width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 20px; flex-shrink: 0; overflow: hidden; position: relative; }
.chat-list-panel .chat-list .chat-item .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.chat-list-panel .chat-list .chat-item .avatar .initials { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; background: var(--accent); }
.chat-list-panel .chat-list .chat-item .avatar img ~ .initials { display: none; }
.chat-list-panel .chat-list .chat-item .avatar .online-dot { position: absolute; bottom: 1px; right: 1px; width: 14px; height: 14px; background: #6c7883; border-radius: 50%; border: 2px solid var(--bg-secondary); }
.chat-list-panel .chat-list .chat-item .avatar .online-dot.online { background: var(--success); }
.chat-list-panel .chat-list .chat-item .info { flex: 1; min-width: 0; padding-right: 60px; }
.chat-list-panel .chat-list .chat-item .info .name { font-weight: 500; font-size: 15px; color: var(--text-primary); margin-bottom: 3px; }
.chat-list-panel .chat-list .chat-item .info .last-msg { font-size: 14px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-list-panel .chat-list .chat-item .time { position: absolute; top: 12px; right: 12px; font-size: 12px; color: var(--text-muted); }
.chat-list-panel .chat-list .chat-item .unread-badge { background: var(--accent); color: #fff; border-radius: 10px; min-width: 20px; height: 20px; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 6px; position: absolute; bottom: 12px; right: 12px; }
.chat-list-panel .chat-list .skeleton-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; animation: shimmer 1.5s infinite; }
.chat-list-panel .chat-list .skeleton-item .skeleton-avatar { width: 54px; height: 54px; border-radius: 50%; background: var(--skeleton-bg); flex-shrink: 0; }
.chat-list-panel .chat-list .skeleton-item .skeleton-text { flex: 1; height: 12px; background: var(--skeleton-bg); border-radius: 6px; }
.chat-list-panel .chat-list .skeleton-item .skeleton-text.short { width: 60%; }
@keyframes shimmer { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

/* ---------- ЧАТ ---------- */
.chat-panel { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); min-width: 0; height: 100%; position: relative; }
.chat-panel .chat-header { padding: 8px 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 14px; flex-shrink: 0; min-height: 56px; padding-top: calc(8px + var(--safe-area-top)); }
.chat-panel .chat-header .back-btn { display: none; background: none; border: none; color: var(--accent); font-size: 24px; cursor: pointer; padding: 4px 8px; min-height: 44px; min-width: 44px; }
.chat-panel .chat-header .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; flex-shrink: 0; overflow: hidden; position: relative; }
.chat-panel .chat-header .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.chat-panel .chat-header .avatar .initials { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.chat-panel .chat-header .info { flex: 1; min-width: 0; }
.chat-panel .chat-header .info .name { font-weight: 500; font-size: 16px; color: var(--text-primary); }
.chat-panel .chat-header .info .status { font-size: 13px; color: var(--text-secondary); }
.chat-panel .chat-header .info .status.online { color: var(--accent); }
.chat-panel .chat-header .actions { display: flex; gap: 2px; }
.chat-panel .chat-header .actions button { background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; padding: 8px; border-radius: 50%; min-height: 40px; min-width: 40px; transition: all 0.15s; }
.chat-panel .chat-header .actions button:hover { background: var(--bg-hover); color: var(--text-primary); }

.chat-panel .status-bar { text-align: center; font-size: 12px; padding: 3px 0; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); color: var(--text-muted); flex-shrink: 0; }
.chat-panel .status-bar.error { color: var(--danger); }
.chat-panel .status-bar.warning { color: #ffb800; }

.chat-panel .messages-area { flex: 1; overflow-y: auto; padding: 16px 8%; display: flex; flex-direction: column; gap: 4px; background: var(--bg-primary); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; position: relative; }

.message-row { display: flex; gap: 8px; align-items: flex-end; max-width: 75%; position: relative; animation: msgIn 0.2s ease-out; }
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.message-row.mine { align-self: flex-end; flex-direction: row-reverse; }

.message-row .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; overflow: hidden; position: relative; cursor: pointer; }
.message-row .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.message-row .avatar .initials { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; background: var(--accent); }
.message-row .avatar img ~ .initials { display: none; }
.message-row.mine .avatar { display: none; }

.message-row .bubble { padding: 7px 12px 6px; max-width: 100%; word-wrap: break-word; overflow-wrap: break-word; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.15); }
.message-row .bubble { background: var(--bubble-other); color: var(--text-primary); border-radius: 12px 12px 12px 0; }
.message-row.mine .bubble { background: var(--bubble-mine); color: #fff; border-radius: 12px 12px 0 12px; }
[data-theme="light"] .message-row.mine .bubble { color: #000; }

.message-row .bubble .sender { font-weight: 500; font-size: 13px; color: #549cdd; margin-bottom: 3px; }
.message-row.mine .bubble .sender { display: none; }
.message-row .bubble .text { font-size: 15px; line-height: 1.35; }
.message-row .bubble .time-status { display: inline-flex; align-items: center; gap: 3px; float: right; margin-left: 8px; margin-top: 4px; }
.message-row .bubble .time { font-size: 11px; color: var(--text-muted); }
.message-row.mine .bubble .time { color: rgba(255,255,255,0.65); }
[data-theme="light"] .message-row.mine .bubble .time { color: rgba(0,0,0,0.5); }

.message-status { display: inline-flex; align-items: center; gap: 0; letter-spacing: -3px; font-size: 12px; }
.message-status .check { display: inline-block; font-size: 12px; line-height: 1; color: var(--text-muted); opacity: 0.7; }
.message-row.mine .message-status .check { color: rgba(255,255,255,0.7); opacity: 1; }
[data-theme="light"] .message-row.mine .message-status .check { color: rgba(0,0,0,0.55); }
.message-status .check.delivered { color: var(--success); opacity: 1; }
.message-row.mine .message-status .check.delivered { color: #8fbaf3; }
.message-status .check.read { color: var(--accent); opacity: 1; }
.message-row.mine .message-status .check.read { color: #ffffff; }
[data-theme="light"] .message-row.mine .message-status .check.read { color: #43a047; }
.message-status .check.sending { animation: blink 1s infinite; }
@keyframes blink { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

/* ---------- ФАЙЛЫ ---------- */
.file-link { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.15); color: inherit; border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 8px 12px; margin: 4px 0; font-size: 14px; font-weight: 500; text-align: left; cursor: pointer; max-width: 300px; transition: background 0.15s; }
.file-link:hover { background: rgba(0,0,0,0.25); }
.message-row.mine .file-link { background: rgba(255,255,255,0.12); }
.message-row.mine .file-link:hover { background: rgba(255,255,255,0.2); }
[data-theme="light"] .message-row.mine .file-link { background: rgba(0,0,0,0.06); }
[data-theme="light"] .message-row.mine .file-link:hover { background: rgba(0,0,0,0.1); }
.file-link::before { content: '📄'; font-size: 22px; flex-shrink: 0; }
.file-info { font-size: 11px; opacity: 0.65; margin-top: 3px; display: block; }
.copy-btn { background: rgba(255,255,255,0.08); color: inherit; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 3px 10px; font-size: 12px; margin-top: 4px; cursor: pointer; }
.copy-btn:hover { background: rgba(255,255,255,0.15); }

/* ---------- ПРЕВЬЮ ССЫЛОК ---------- */
.link-preview { margin: 6px 0; border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; overflow: hidden; max-width: 360px; background: rgba(0,0,0,0.15); cursor: pointer; transition: all 0.15s; }
.link-preview:hover { background: rgba(0,0,0,0.25); }
.link-preview .preview-image { width: 100%; max-height: 180px; object-fit: cover; background: var(--bg-input); }
.link-preview .preview-content { padding: 8px 12px; }
.link-preview .preview-title { font-weight: 500; color: inherit; font-size: 14px; margin-bottom: 3px; }
.link-preview .preview-description { font-size: 13px; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.link-preview .preview-url { font-size: 11px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; }

/* ---------- ГОЛОСОВЫЕ ---------- */
.voice-message { display: flex; align-items: center; gap: 10px; padding: 4px 0; min-width: 200px; max-width: 320px; }
.voice-message .play-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); border: none; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 0.15s; }
.voice-message .play-btn:hover { transform: scale(1.06); }
.voice-message .play-btn.playing { animation: spin 2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.voice-message .waveform { flex: 1; height: 26px; display: flex; align-items: center; gap: 2px; cursor: pointer; padding: 0 2px; min-width: 60px; }
.voice-message .waveform .bar { width: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; transition: all 0.2s; flex-shrink: 0; }
.message-row.mine .voice-message .waveform .bar { background: rgba(255,255,255,0.4); }
.voice-message .waveform .bar.active { background: currentColor !important; }
.voice-message .time-label { font-size: 12px; color: var(--text-muted); min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; }
.message-row.mine .voice-message .time-label { color: rgba(255,255,255,0.7); }
.voice-message .speed-btn { background: none; border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 2px 7px; font-size: 11px; color: inherit; cursor: pointer; }
.voice-message .speed-btn.active { border-color: var(--accent); color: var(--accent); }
.voice-message .download-btn { background: none; border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 2px 6px; font-size: 13px; color: inherit; cursor: pointer; }

/* ---------- РЕАКЦИИ ---------- */
.reactions { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px; }
.reactions .reaction { background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 12px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; user-select: none; transition: all 0.15s; }
.reactions .reaction:hover { background: rgba(0,0,0,0.35); }
.message-row.mine .reactions .reaction { background: rgba(255,255,255,0.15); }
.message-row.mine .reactions .reaction:hover { background: rgba(255,255,255,0.25); }
.reactions .reaction .count { font-size: 12px; opacity: 0.8; }
.reactions .reaction.reacted { background: rgba(82,136,193,0.4); color: #cfe3ff; }
.message-row.mine .reactions .reaction.reacted { background: rgba(255,255,255,0.3); color: #fff; }
.reactions .reaction.reacted { animation: reactionPop 0.3s ease-out; }
@keyframes reactionPop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

.reaction-popup { display: none; position: fixed; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 24px; padding: 6px 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 100; animation: popUp 0.15s ease-out; }
.reaction-popup.active { display: flex; gap: 2px; }
.reaction-popup .reaction-option { font-size: 26px; cursor: pointer; padding: 4px 6px; border-radius: 50%; transition: all 0.15s; }
.reaction-popup .reaction-option:hover { transform: scale(1.3); }
.reaction-popup .close-reactions { font-size: 14px; cursor: pointer; padding: 4px 6px; color: var(--text-muted); }

    let mediaRecorder = null;

    voiceBtn.addEventListener('click', () => {

        else startRecording();

    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
            });
            let mimeType = 'audio/webm';
            if (!MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/ogg';
            if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/mp4';
            mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType, audioBitsPerSecond: 128000 });
            audioChunks = [];
            recordingStartTime = Date.now();
            recordingDuration = 0;
            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) audioChunks.push(event.data);
            };
            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: mimeType });
                const file = new File([audioBlob], 'voice.' + mimeType.split('/')[1], { type: mimeType });
                sendVoiceMessage(file, recordingDuration);
                stream.getTracks().forEach(track => track.stop());
                isRecording = false;
                voiceBtn.textContent = '🎤';
                voiceBtn.classList.remove('recording');
                if (recordingTimer) { clearInterval(recordingTimer); recordingTimer = null; }
                statusDiv.textContent = '✅ Голосовое сообщение записано';
                statusDiv.className = 'status-bar';
            };
            mediaRecorder.start(1000);
            isRecording = true;
            voiceBtn.textContent = '⏹️';
            voiceBtn.classList.add('recording');
            recordingTimer = setInterval(() => {
                recordingDuration = Math.floor((Date.now() - recordingStartTime) / 1000);
                const mins = String(Math.floor(recordingDuration / 60)).padStart(2, '0');
                const secs = String(recordingDuration % 60).padStart(2, '0');
                statusDiv.textContent = '🎤 Запись... ' + mins + ':' + secs;
                statusDiv.className = 'status-bar warning';
            }, 500);
            showToast('🎤 Запись... Нажмите ещё раз для отправки');
        } catch(err) {
            alert('Не удалось получить доступ к микрофону: ' + err.message);
            isRecording = false;
            voiceBtn.textContent = '🎤';
            voiceBtn.classList.remove('recording');
        }
    }
    function stopRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            voiceBtn.textContent = '⏳';
            voiceBtn.classList.remove('recording');
            if (recordingTimer) { clearInterval(recordingTimer); recordingTimer = null; }
            showToast('⏳ Обработка голосового сообщения...');
        }
    }
    async function sendVoiceMessage(file, duration) {
        if (!currentUser) return;
        if (file.size > 10 * 1024 * 1024) { showToast('❌ Голосовое сообщение слишком большое (макс. 10MB)'); return; }
        showToast('📤 Загрузка голосового сообщения...');
        try {
            const result = await uploadToGoFile(file);
            const to = currentContact === 'all' ? null : currentContact;
            const payload = {
                name: currentName,
                userId: currentUserId,
                text: result.directLink,
                fileName: 'Голосовое сообщение',
                fileSize: file.size,
                isFile: true,
                isVoice: true,
                duration: duration || Math.floor(file.size / 16000),
                to: to,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                status: 'sending'
            };
            if (currentGroupId) groupMessagesRef.child(currentGroupId).push(payload);
            else messagesRef.push(payload);
            showToast('✅ Голосовое сообщение отправлено!');
        } catch(err) {
            showToast('❌ Ошибка загрузки: ' + err.message);
        }
    }

            e.stopPropagation();
            if (data.text) window.open(data.text, '_blank');
            else showToast('❌ Ссылка на файл отсутствует');
        };
        let audio = null;
        let isPlaying = false;
        let playSpeed = 1;
        let progressInterval = null;
        function updateWaveform(progress) {
            const count = Math.floor(progress * bars.length);
            bars.forEach((bar, i) => { bar.classList.toggle('active', i < count); });
        }
        function updateTime(currentTime) {
            const total = parseFloat(timeLabel.dataset.duration) || 30;
            const remaining = Math.max(0, total - currentTime);
            const mins = String(Math.floor(remaining / 60)).padStart(2, '0');
            const secs = String(Math.floor(remaining % 60)).padStart(2, '0');
            timeLabel.textContent = mins + ':' + secs;
        }
        async function getAudioUrl(originalUrl) {
            const proxyUrls = ['https://api.allorigins.win/raw?url=', 'https://corsproxy.io/?'];
            for (const proxy of proxyUrls) {
                try {
                    const response = await fetch(proxy + encodeURIComponent(originalUrl));
                    if (response.ok) return URL.createObjectURL(await response.blob());
                } catch (e) {}
            }
            return originalUrl;
        }
        playBtn.addEventListener('click', async () => {
            const audioUrl = data.text;
            if (!audioUrl) { showToast('❌ Ссылка на аудио отсутствует'); return; }
            if (!audio) {
                try {
                    const proxiedUrl = await getAudioUrl(audioUrl);
                    audio = new Audio();
                    audio.src = proxiedUrl;
                    audio.crossOrigin = 'anonymous';
                    audio.preload = 'metadata';
                    audio.onloadedmetadata = () => {
                        if (audio.duration && !isNaN(audio.duration) && audio.duration > 0) {
                            const total = audio.duration;
                            const mins = String(Math.floor(total / 60)).padStart(2, '0');
                            const secs = String(Math.floor(total % 60)).padStart(2, '0');
                            timeLabel.textContent = mins + ':' + secs;
                            timeLabel.dataset.duration = total;
                        }
                    };
                    audio.onended = () => {
                        isPlaying = false;
                        playBtn.textContent = '▶';
                        playBtn.classList.remove('playing');
                        updateWaveform(1);
                        const total = parseFloat(timeLabel.dataset.duration) || 30;
                        const mins = String(Math.floor(total / 60)).padStart(2, '0');
                        const secs = String(Math.floor(total % 60)).padStart(2, '0');
                        timeLabel.textContent = mins + ':' + secs;
                        if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
                        setTimeout(() => bars.forEach(bar => bar.classList.remove('active')), 500);
                    };
                    audio.onerror = () => {
                        showToast('❌ Не удалось воспроизвести. Попробуйте скачать файл.');
                        isPlaying = false;
                        playBtn.textContent = '▶';
                        playBtn.classList.remove('playing');
                        if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
                    };
                    audio.ontimeupdate = () => {
                        if (audio.duration && !isNaN(audio.duration) && audio.duration > 0) {
                            updateWaveform(audio.currentTime / audio.duration);
                            updateTime(audio.currentTime);
                        }
                    };
                    audio.load();
                } catch (err) { showToast('❌ Ошибка создания аудио'); return; }
            }
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playBtn.textContent = '▶';
                playBtn.classList.remove('playing');
                if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
            } else {
                try {
                    audio.playbackRate = playSpeed;
                    await audio.play();
                    isPlaying = true;
                    playBtn.textContent = '⏸';
                    playBtn.classList.add('playing');
                    if (progressInterval) clearInterval(progressInterval);
                    progressInterval = setInterval(() => {
                        if (audio && audio.duration && !isNaN(audio.duration) && audio.duration > 0) {
                            updateWaveform(audio.currentTime / audio.duration);
                            updateTime(audio.currentTime);
                        }
                    }, 100);
                } catch (err) {
                    showToast('❌ Ошибка воспроизведения. Скачайте файл.');
                    if (data.text) window.open(data.text, '_blank');
                }
            }
        });
        speedBtn.addEventListener('click', () => {
            const speeds = [1, 1.5, 2];
            const current = parseFloat(speedBtn.dataset.speed);
            const idx = speeds.indexOf(current);
            const next = speeds[(idx + 1) % speeds.length];
            speedBtn.dataset.speed = next;
            speedBtn.textContent = next + '×';
            playSpeed = next;
            if (audio) audio.playbackRate = next;
            speedBtn.classList.toggle('active', next !== 1);
        });
        container.appendChild(playBtn);
        container.appendChild(waveform);
        container.appendChild(timeLabel);
        container.appendChild(speedBtn);
        container.appendChild(downloadBtn);
        return container;
    }

        else {

            if (isFromMe && isToContact) return true;
            if (isFromContact && isToMe) return true;
            return false;

        if (lower.includes('спасибо') || lower.includes('благодарю')) replies.push('Пожалуйста! 😊', 'Всегда рад помочь!', 'Обращайся!');
        if (lower.includes('да') || lower.includes('согласен')) replies.push('Отлично! 👍', 'Договорились!', 'Супер!');
        if (lower.includes('нет') || lower.includes('не согласен')) replies.push('Понимаю 🤔', 'Может обсудим?', 'Хорошо, как скажешь');
        if (lower.includes('пока') || lower.includes('до свидания')) replies.push('Пока! 👋', 'До встречи!', 'Всего хорошего!');
        if (lower.includes('?')) replies.push('Да', 'Нет', 'Не знаю 🤔', 'А ты как думаешь?');
        if (replies.length === 0) replies.push('Понял 👍', 'Хорошо!', 'Интересно 🤔', 'Согласен!');

    async function fetchLinkPreview(url) {
        try {
            const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
            const html = await response.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const title = doc.querySelector('meta[property="og:title"]')?.content || doc.querySelector('title')?.textContent || url;
            const description = doc.querySelector('meta[property="og:description"]')?.content || doc.querySelector('meta[name="description"]')?.content || '';
            const image = doc.querySelector('meta[property="og:image"]')?.content || doc.querySelector('link[rel="image_src"]')?.href || '';
            const siteName = doc.querySelector('meta[property="og:site_name"]')?.content || '';
            return { title, description, image, siteName, url };
        } catch (err) { return null; }
    }
    function extractLinks(text) {
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        return text.match(urlRegex) || [];
    }
    async function processLinks(text, messageId) {
        const links = extractLinks(text);
        if (links.length === 0) return;
        const previews = [];
        for (const link of links) {
            const preview = await fetchLinkPreview(link);
            if (preview) previews.push(preview);
        }
        if (previews.length > 0) await messagesRef.child(messageId).update({ previews: previews });
    }
    function createLinkPreviewElement(preview) {
        const container = document.createElement('div');
        container.className = 'link-preview';
        container.onclick = () => window.open(preview.url, '_blank');
        if (preview.image) {
            const img = document.createElement('img');
            img.className = 'preview-image';
            img.src = preview.image;
            img.alt = '';
            img.onerror = function() { this.style.display = 'none'; };
            container.appendChild(img);
        }
        const content = document.createElement('div');
        content.className = 'preview-content';
        if (preview.siteName) {
            const site = document.createElement('div');
            site.className = 'preview-url';
            site.textContent = preview.siteName;
            content.appendChild(site);
        }
        if (preview.title) {
            const title = document.createElement('div');
            title.className = 'preview-title';
            title.textContent = preview.title;
            content.appendChild(title);
        }
        if (preview.description) {
            const desc = document.createElement('div');
            desc.className = 'preview-description';
            desc.textContent = preview.description;
            content.appendChild(desc);
        }
        container.appendChild(content);
        return container;
    }

        const found = contactListArray.filter(name => {
            const contactId = getUserIdByName(name);

        });
        if (found.length > 0) { showToast(`✅ Найдено ${found.length} контактов по ID`); return; }
        usersRef.orderByChild('userId').startAt(query).endAt(query + '\uf8ff').once('value')
            .then(snap => {

                snap.forEach(childSnap => {
                    const data = childSnap.val();
                    if (data.name && data.userId) results.push({ name: data.name, userId: data.userId });
                });
                if (results.length > 0) { showToast(`✅ Найдено ${results.length} пользователей`); showSearchResults(results); }

    function handleContextAction(action, key) {
        const msgData = messagesCache.find(m => m.key === key);
        if (!msgData) return;
        switch(action) {
            case 'reply':
                messageInput.value = '> ' + msgData.name + ': ' + (msgData.text || '') + '\n';
                messageInput.focus();
                break;
            case 'quote':
                messageInput.value = '> ' + msgData.name + ': ' + (msgData.text || '') + '\n\n';
                messageInput.focus();
                break;
            case 'pin':
                messagesRef.child(key).update({ pinned: true });
                showToast('📌 Сообщение закреплено');
                break;
            case 'edit':
                if (msgData.name !== currentName) { alert('Редактировать можно только свои сообщения.'); return; }
                const newText = prompt('Редактировать:', msgData.text);
                if (newText !== null && newText.trim() !== '') {
                    messagesRef.child(key).update({ text: newText.trim(), edited: true });
                }
                break;
            case 'delete':
                if (msgData.name !== currentName) { alert('Удалять можно только свои сообщения.'); return; }
                if (confirm('Удалить сообщение?')) messagesRef.child(key).remove();
                break;
            case 'forward':
                const fwd = prompt('Кому отправить (или пусто для общего):');
                if (fwd !== null) {
                    messagesRef.push({
                        name: currentName, userId: currentUserId, text: msgData.text || '',
                        to: fwd.trim() || null,
                        timestamp: firebase.database.ServerValue.TIMESTAMP,
                        forwarded: true, originalSender: msgData.name
                    });
                }
                break;
            case 'addcontact':
                if (msgData.name && !contactListArray.includes(msgData.name)) addContact(msgData.name);
                break;
        }
    }

    // ============================================================
    // ГРУППЫ
    // ============================================================
    function createGroup() {
        if (!currentUser) { alert('Войдите в систему'); return; }
        const groupName = prompt('Введите название группы:');
        if (!groupName || !groupName.trim()) return;
        const members = prompt('Введите имена участников через запятую (включая себя):');
        if (!members) return;
        const memberList = members.split(',').map(m => m.trim()).filter(m => m);
        if (memberList.length < 2) { alert('В группе должно быть минимум 2 участника'); return; }
        const checkPromises = memberList.map(name => usersRef.orderByChild('name').equalTo(name).once('value'));
        Promise.all(checkPromises).then(results => {
            const validMembers = [];
            results.forEach((snap, idx) => {
                if (snap.exists()) {
                    snap.forEach(childSnap => {
                        const data = childSnap.val();
                        validMembers.push({ name: data.name, userId: data.userId || data.name });
                    });
                } else alert('Пользователь "' + memberList[idx] + '" не найден');
            });
            if (validMembers.length < 2) return;
            const groupId = 'group_' + Date.now();
            groupsRef.child(groupId).set({
                name: groupName.trim(),
                creator: currentName,
                creatorId: currentUserId,
                members: validMembers,
                createdAt: firebase.database.ServerValue.TIMESTAMP,
                avatar: '👥'
            });
            validMembers.forEach(m => {
                if (m.name !== currentName && !contactListArray.includes(m.name)) addContact(m.name);
            });
            showToast('✅ Группа "' + groupName.trim() + '" создана!');
            loadGroups();
        }).catch(err => alert('Ошибка: ' + err.message));
    }
    function loadGroups() {
        if (!currentUser) return;
        groupsRef.on('value', (snapshot) => {
            const data = snapshot.val() || {};
            groups = {};
            Object.keys(data).forEach(key => {
                const group = data[key];
                const isMember = group.members.some(m => m.name === currentName || m.userId === currentUserId);
                if (isMember) groups[key] = group;
            });
            renderChatList();
        });
    }
    function getFilteredChats() {
        const items = [];
        if (currentFolder === 'all' || currentFolder === 'general') {
            items.push({ id: 'all', name: 'Общий чат',
                lastMsg: contacts['all']?.lastMsg || 'Нет сообщений',
                time: contacts['all']?.time || '', type: 'general', isGroup: false });
        }
        if (currentFolder === 'all' || currentFolder === 'personal') {
            const sorted = [...contactListArray].sort((a, b) => (contacts[b]?.timestamp || 0) - (contacts[a]?.timestamp || 0));
            sorted.forEach(name => {
                const data = contacts[name] || { lastMsg: 'Нет сообщений', time: '' };
                items.push({ id: name, name: name, lastMsg: data.lastMsg, time: data.time, type: 'personal', isGroup: false });
            });
        }
        if (currentFolder === 'all' || currentFolder === 'groups') {
            Object.keys(groups).forEach(groupId => {
                const group = groups[groupId];
                items.push({ id: groupId, name: group.name + ' 👥',
                    lastMsg: group.members.length + ' участников', time: '', type: 'group', isGroup: true, groupData: group });
            });
        }
        return items;
    }
    function switchToGroup(groupId) {
        currentGroupId = groupId;
        currentContact = 'group_' + groupId;
        const group = groups[groupId];
        if (!group) return;
        chatHeaderName.textContent = group.name + ' 👥';
        chatHeaderAvatar.textContent = '👥';
        chatHeaderStatus.textContent = group.members.length + ' участников';
        chatHeaderStatus.className = 'status';
        messagesDiv.innerHTML = '';
        messageNodes = {};
        messagesCache = [];
        messagesRef.off();
        messageListenerStarted = false;
        listenGroupMessages(groupId);
        renderChatList();
    }
    function listenGroupMessages(groupId) {
        if (messageListenerStarted) return;
        messageListenerStarted = true;
        const groupRef = groupMessagesRef.child(groupId);
        groupRef.limitToLast(100).once('value', (snapshot) => {
            const items = [];
            snapshot.forEach((childSnapshot) => {
                items.push({ key: childSnapshot.key, ...childSnapshot.val() });
            });
            items.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            items.forEach(item => {
                if (!messageNodes[item.key]) addGroupMessageToUI(item.key, item);
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            isAtBottom = true;
        });
        groupRef.limitToLast(1).on('child_added', (snapshot) => {
            const data = snapshot.val();
            const key = snapshot.key;
            if (messagesCache.some(m => m.key === key) || messageNodes[key]) return;
            addGroupMessageToUI(key, data);
        });
    }
    function addGroupMessageToUI(key, data) {
        if (messagesCache.some(m => m.key === key) || messageNodes[key]) return;
        if (!data.status) data.status = 'sending';
        messagesCache.push({ key, ...data });
        messageStatuses[key] = data.status;
        const row = createMessageRow(key, data);
        messagesDiv.appendChild(row);
        messageNodes[key] = row;
        if (isAtBottom) messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // ============================================================
    // ЧАТЫ
    // ============================================================
    function renderChatList() {
        chatList.innerHTML = '';
        if (!currentUser) {
            for (let i = 0; i < 5; i++) {
                const skeleton = document.createElement('div');
                skeleton.className = 'skeleton-item';
                skeleton.innerHTML = `<div class="skeleton-avatar"></div><div><div class="skeleton-text" style="width:120px;"></div><div class="skeleton-text short" style="margin-top:6px;"></div></div>`;
                chatList.appendChild(skeleton);
            }
            return;
        }
        const filtered = getFilteredChats();
        if (filtered.length === 0) {
            const empty = document.createElement('div');
            empty.style.cssText = 'padding:40px 20px;text-align:center;color:var(--text-muted);';
            empty.textContent = '📭 Нет чатов в этой папке';
            chatList.appendChild(empty);
            return;
        }
        filtered.forEach(item => {
            const div = createChatItem(item.id, item.name, item.lastMsg, item.time, item.isGroup);
            if (item.isGroup) { div.dataset.group = item.id; div.dataset.isGroup = 'true'; }
            chatList.appendChild(div);
        });
        document.querySelectorAll('.chat-item').forEach(el => {
            if (el.dataset.contact === currentContact) el.classList.add('active');
        });
        setTimeout(updateOnlineDots, 100);
        updateBadge();
    }

    function createChatItem(id, displayName, lastMsg, time, isGroup = false) {
        const div = document.createElement('div');
        div.className = 'chat-item';
        div.dataset.contact = id;
        if (!isGroup && id !== 'all') div.dataset.userId = id;
        let avatarUrl = null;
        if (!isGroup && id !== 'all') avatarUrl = getAvatarUrl(id);
        const avatar = createAvatarElement(displayName, avatarUrl, 54);
        if (id !== 'all' && !isGroup) {
            const dot = document.createElement('span');
            dot.className = 'online-dot';
            avatar.appendChild(dot);
        } else if (isGroup) {
            const icon = document.createElement('span');
            icon.textContent = '👥';
            icon.style.fontSize = '22px';
            avatar.appendChild(icon);
        } else {
            const icon = document.createElement('span');
            icon.textContent = '💬';
            icon.style.fontSize = '22px';
            avatar.appendChild(icon);
        }
        div.appendChild(avatar);
        const info = document.createElement('div');
        info.className = 'info';
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = displayName;
        const msg = document.createElement('div');
        msg.className = 'last-msg';
        msg.textContent = lastMsg;
        info.appendChild(name);
        info.appendChild(msg);
        div.appendChild(info);
        const timeEl = document.createElement('div');
        timeEl.className = 'time';
        timeEl.textContent = time;
        div.appendChild(timeEl);
        if (id !== 'all' && !isGroup && unreadCounts[id] && unreadCounts[id] > 0) {
            const badge = document.createElement('span');
            badge.className = 'unread-badge';
            badge.textContent = unreadCounts[id];
            div.appendChild(badge);
        }
        div.onclick = () => {
            if (isGroup) switchToGroup(id);
            else if (id !== 'all') {
                unreadCounts[id] = 0;
                renderChatList();
                unreadTotal = 0;
                updateBadge();
                stopBlinking();
                switchContact(id);
            } else switchContact(id);
            if (window.innerWidth <= 768) closeChatList();
        };
        return div;
    }

    function switchContact(id) {
        currentContact = id;
        currentGroupId = null;
        const displayName = id === 'all' ? 'Общий чат' : id;
        chatHeaderName.textContent = displayName;
        chatHeaderAvatar.innerHTML = '';
        if (id === 'all') {
            chatHeaderAvatar.textContent = '💬';
            chatHeaderAvatar.style.background = 'var(--accent)';
            chatHeaderStatus.textContent = 'онлайн';
            chatHeaderStatus.className = 'status';
        } else {
            const avatarUrl = getAvatarUrl(id);
            const avatarEl = createAvatarElement(displayName, avatarUrl, 42);
            chatHeaderAvatar.appendChild(avatarEl);
            chatHeaderStatus.textContent = 'в сети';
            chatHeaderStatus.className = 'status online';
        }
        messagesDiv.innerHTML = '';
        messageNodes = {};
        messagesCache = [];
        messagesRef.off();
        messageListenerStarted = false;
        listenMessages();
        clearTypingListeners();
        setupTypingListener();
        renderChatList();
    }

    function addContact(contactName) {
        if (!contactName || contactName === currentName) return;
        if (contactListArray.includes(contactName)) { showToast('Контакт уже есть в списке.'); return; }
        contactListArray.push(contactName);
        saveContacts();
        renderChatList();
        showToast('✅ Контакт добавлен');
    }
    function removeContact(contactName) {
        if (!contactName) return;
        const idx = contactListArray.indexOf(contactName);
        if (idx !== -1) {
            contactListArray.splice(idx, 1);
            saveContacts();
            renderChatList();
            if (currentContact === contactName) switchContact('all');
            showToast('🗑 Контакт удалён');
        }
    }
    function saveContacts() {
        if (!currentUser) return;
        const contactsData = {};
        contactListArray.forEach(name => { contactsData[sanitizeKey(name)] = true; });
        usersRef.child(currentUser.uid + '/contacts').set(contactsData);
    }
    function loadContacts() {
        if (!currentUser) return;
        usersRef.child(currentUser.uid + '/contacts').once('value').then(snap => {
            const data = snap.val() || {};
            contactListArray = Object.keys(data);
            renderChatList();
        });
    }
    function updateBadge() {
        let total = 0;
        Object.values(unreadCounts).forEach(c => total += c);
        if (total > 0) {
            tabBadge.style.display = 'flex';
            tabBadge.textContent = total > 99 ? '99+' : total;
        } else tabBadge.style.display = 'none';
    }

    // ============================================================
    // СООБЩЕНИЯ
    // ============================================================
    function listenMessages() {
        if (!currentName || !currentUserId) return;
        if (messageListenerStarted) return;
        messageListenerStarted = true;
        messagesDiv.innerHTML = '';
        messageNodes = {};
        messagesCache = [];
        messageStatuses = {};
        lastNotifiedMessageCount = 0;
        messagesRef.limitToLast(100).once('value', (snapshot) => {
            const items = [];
            snapshot.forEach((childSnapshot) => {
                items.push({ key: childSnapshot.key, ...childSnapshot.val() });
            });
            items.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            items.forEach(item => {
                if (!messageNodes[item.key]) addMessageToUI(item.key, item);
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            isAtBottom = true;
            markAllAsRead();
        });
        messagesRef.limitToLast(1).on('child_added', (snapshot) => {
            const data = snapshot.val();
            const key = snapshot.key;
            if (messagesCache.some(m => m.key === key) || messageNodes[key]) return;
            if (data.name !== currentName && (data.to === currentName || !data.to)) {
                const title = data.name || 'Аноним';
                let body = data.text || '';
                if (data.isFile) body = '📎 Файл';
                if (data.isVoice) body = '🎤 Голосовое';
                if (!body) body = 'Новое сообщение';
                showEnhancedNotification(title, body, { contact: data.name });
            }
            addMessageToUI(key, data);
            if (data.name !== currentName) {
                lastMessageForReplies = data;
                setTimeout(() => showSmartReplies(data), 500);
            }
            if (!isAtBottom && data.name !== currentName) {
                newMessagesCountVal++;
                updateNewMessagesBtn();
            }
            if (data.name !== currentName && (data.to === currentName || !data.to)) {
                if (document.hidden || document.visibilityState === 'hidden') {
                    unreadTotal++;
                    updateBadge();
                    startBlinking();
                }
            }
        });
        messagesRef.on('child_changed', (snapshot) => {
            const data = snapshot.val();
            const key = snapshot.key;
            const existing = messagesCache.find(m => m.key === key);
            if (existing) {
                const oldStatus = existing.status;
                Object.assign(existing, data);
                const node = messageNodes[key];
                if (node) {
                    const newRow = createMessageRow(key, data);
                    node.parentNode.replaceChild(newRow, node);
                    messageNodes[key] = newRow;
                }
                if (data.status && data.status !== oldStatus) updateMessageStatus(key, data.status);
            }
        });
        messagesRef.on('child_removed', (snapshot) => {
            const key = snapshot.key;
            const node = messageNodes[key];
            if (node) { node.remove(); delete messageNodes[key]; }
            const idx = messagesCache.findIndex(m => m.key === key);
            if (idx !== -1) messagesCache.splice(idx, 1);
            updateContactsFromCache();
        });
        setupTypingListener();
    }

    function addMessageToUI(key, data) {
        if (messagesCache.some(m => m.key === key) || messageNodes[key]) return;
        if (!isMessageRelevant(data)) {
            if (data.to && data.to !== '') {
                const contactId = data.to === currentName ? data.name : data.to;
                if (contactId && contactId !== currentName) {
                    if (!unreadCounts[contactId]) unreadCounts[contactId] = 0;
                    if (currentContact !== contactId) {
                        unreadCounts[contactId]++;
                        renderChatList();
                    }
                    if (!contacts[contactId]) contacts[contactId] = {};
                    contacts[contactId].lastMsg = data.text || (data.isFile ? '📎 Файл' : '');
                    contacts[contactId].timestamp = data.timestamp || 0;
                    contacts[contactId].time = data.timestamp ? formatTime(data.timestamp) : '';
                    renderChatList();
                }
            }
            return;
        }
        if (!data.status) data.status = 'sending';
        messagesCache.push({ key, ...data });
        messageStatuses[key] = data.status;
        const row = createMessageRow(key, data);
        messagesDiv.appendChild(row);
        messageNodes[key] = row;
        if (isAtBottom) messagesDiv.scrollTop = messagesDiv.scrollHeight;
        updateContactsFromCache();
        if (data.name === currentName && data.status === 'sending') {
            setTimeout(() => {
                updateMessageStatus(key, 'sent');
                messagesRef.child(key).update({ status: 'sent' });
            }, 500);
        }
    }

    function createMessageRow(key, data) {
        const row = document.createElement('div');
        row.className = 'message-row' + (data.name === currentName ? ' mine' : '');
        row.dataset.key = key;
        const avatarUrl = data.name ? getAvatarUrl(data.name) : null;
        const avatar = createAvatarElement(data.name || '?', avatarUrl, 34);
        avatar.addEventListener('click', () => {
            if (data.name && data.name !== currentName && !contactListArray.includes(data.name)) {
                if (confirm('Добавить ' + data.name + ' в контакты?')) addContact(data.name);
            }
        });
        row.appendChild(avatar);
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        const sender = document.createElement('div');
        sender.className = 'sender';
        let senderText = data.name || 'Аноним';
        if (data.to && data.to !== currentName && data.name === currentName) senderText += ' ➔ ' + data.to;
        if (data.to && data.to === currentName && data.name !== currentName) senderText += ' (личное)';
        if (data.edited) senderText += ' (ред.)';
        if (data.pinned) senderText += ' 📌';
        sender.textContent = senderText;
        bubble.appendChild(sender);
        const textDiv = document.createElement('div');
        textDiv.className = 'text';
        if (data.isVoice && data.text) textDiv.appendChild(createVoiceMessageElement(data));
        else if (data.isFile && data.text) {
            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'file-link';
            downloadBtn.textContent = 'Скачать "' + (data.fileName || 'файл') + '"';
            downloadBtn.onclick = (e) => { e.stopPropagation(); downloadFile(data.text, data.fileName || 'file'); };
            textDiv.appendChild(downloadBtn);
            if (data.fileSize) {
                const info = document.createElement('div');
                info.className = 'file-info';
                info.textContent = 'Размер: ' + (data.fileSize / 1024 / 1024).toFixed(2) + ' MB';
                textDiv.appendChild(info);
            }
        } else if (data.text) {
            data.text.split('\n').forEach((line, i) => {
                if (i > 0) textDiv.appendChild(document.createElement('br'));
                const p = document.createElement('span');
                p.textContent = line;
                textDiv.appendChild(p);
            });
        }
        if (data.previews && data.previews.length > 0) {
            data.previews.forEach(preview => textDiv.appendChild(createLinkPreviewElement(preview)));
        }
        if (data.reactions) {
            const reactionsContainer = document.createElement('div');
            reactionsContainer.className = 'reactions';
            ['❤️', '😂', '😮', '😢', '🔥'].forEach(emoji => {
                const count = data.reactions[emoji] || 0;
                const reacted = data.reactions[emoji + '_users'] && data.reactions[emoji + '_users'].includes(currentUserId);
                if (count > 0) {
                    const span = document.createElement('span');
                    span.className = 'reaction' + (reacted ? ' reacted' : '');
                    span.innerHTML = emoji + ' <span class="count">' + count + '</span>';
                    span.onclick = (e) => { e.stopPropagation(); toggleReaction(key, emoji); };
                    reactionsContainer.appendChild(span);
                }
            });
            if (reactionsContainer.children.length > 0) bubble.appendChild(reactionsContainer);
        }
        bubble.appendChild(textDiv);
        const timeStatusWrap = document.createElement('div');
        timeStatusWrap.className = 'time-status';
        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = data.timestamp ? formatTime(data.timestamp) : '';
        timeStatusWrap.appendChild(time);
        if (data.name === currentName) {
            const statusSpan = document.createElement('span');
            statusSpan.className = 'message-status';
            statusSpan.innerHTML = getStatusHTML(data.status || 'sent');
            timeStatusWrap.appendChild(statusSpan);
        }
        bubble.appendChild(timeStatusWrap);
        row.appendChild(bubble);
        row.addEventListener('dblclick', (e) => { e.stopPropagation(); showReactionPopup(key, data, e); });
        row.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
            showContextMenu(key, data);
        });
        let longPressTimer = null;
        row.addEventListener('touchstart', (e) => {
            if (e.target.closest('.reaction')) return;
            longPressTimer = setTimeout(() => showContextMenu(key, data), 500);
        }, { passive: true });
        row.addEventListener('touchend', () => clearTimeout(longPressTimer), { passive: true });
        row.addEventListener('touchmove', () => clearTimeout(longPressTimer), { passive: true });
        return row;
    }

    function markAllAsRead() {
        messagesCache.forEach(msg => {
            if (msg.name !== currentName && (msg.to === currentName || !msg.to)) {
                if (msg.status !== 'read') messagesRef.child(msg.key).update({ status: 'read' });
            }
        });
    }

    // ============================================================
    // ВХОД
    // ============================================================
    async function signInWithRetry(email, pass, retries = 3) {
        let lastError = null;
        for (let i = 0; i < retries; i++) {
            try {
                const btn = document.getElementById('loginSubmitBtn');
                btn.textContent = `⏳ Попытка ${i + 1}/${retries}...`;
                btn.disabled = true;
                const result = await auth.signInWithEmailAndPassword(email, pass);
                btn.textContent = '✅ Вход';
                btn.disabled = false;
                return result;
            } catch (err) {
                lastError = err;
                if (err.code === 'auth/network-request-failed' && i < retries - 1) {
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    if (!navigator.onLine) { showToast('⚠️ Нет интернета. Проверьте подключение.'); break; }
                } else break;
            }
        }
        const btn = document.getElementById('loginSubmitBtn');
        btn.textContent = 'Войти';
        btn.disabled = false;
        throw lastError || new Error('Не удалось войти');
    }

    // ============================================================
    // ОТПРАВКА
    // ============================================================
    function sendMessage(text) {
        if (!currentUser || !currentName || !currentUserId) return;
        if (currentGroupId) {
            groupMessagesRef.child(currentGroupId).push({
                name: currentName, userId: currentUserId, text: text || '',
                timestamp: firebase.database.ServerValue.TIMESTAMP, status: 'sending'
            });
            clearTypingStatus();
            return;
        }
        let to = null;
        if (currentContact !== 'all') to = currentContact;
        const payload = {
            name: currentName, userId: currentUserId, text: text || '',
            to: to, timestamp: firebase.database.ServerValue.TIMESTAMP, status: 'sending'
        };
        const newRef = messagesRef.push(payload);
        processLinks(text, newRef.key);
        clearTypingStatus();
    }
    function sendText() {
        const text = messageInput.value.trim();
        if (!text) return;
        sendMessage(text);
        messageInput.value = '';
    }
    sendBtn.onclick = sendText;
    messageInput.onkeydown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
    };

    // ============================================================
    // ФАЙЛЫ
    // ============================================================
    fileBtn.addEventListener('click', () => {
        if (!currentUser) { alert('Войдите в систему'); return; }
        fileInput.click();
    });
    fileInput.onchange = (e) => {
        if (e.target.files.length) {
            const file = e.target.files[0];
            if (file.size > 100 * 1024 * 1024) { alert('Файл слишком большой (максимум 100MB)'); fileInput.value = ''; return; }
            shareFile(file);
            fileInput.value = '';
        }
    };
    function shareFile(file) {
        if (!currentUser) { alert('Войдите в систему'); return; }
        const to = currentContact === 'all' ? null : currentContact;
        showToast('📤 Загружаем файл "' + file.name + '"...');
        fileBtn.style.opacity = '0.5';
        fileBtn.disabled = true;
        uploadToGoFile(file).then((result) => {
            showToast('✅ Файл загружен!');
            const payload = {
                name: currentName, userId: currentUserId,
                text: result.directLink, fileName: result.fileName, fileSize: result.fileSize,
                isFile: true, to: to,
                timestamp: firebase.database.ServerValue.TIMESTAMP, status: 'sending'
            };
            if (currentGroupId) groupMessagesRef.child(currentGroupId).push(payload);
            else messagesRef.push(payload);
            fileBtn.style.opacity = '1';
            fileBtn.disabled = false;
        }).catch((err) => {
            showToast('❌ Ошибка загрузки: ' + err.message);
            fileBtn.style.opacity = '1';
            fileBtn.disabled = false;
        });
    }

    // ============================================================
    // DRAG AND DROP
    // ============================================================
    let dragCounter = 0;
    document.addEventListener('dragover', (e) => {
        e.preventDefault();
        const chatPanel = document.getElementById('chatPanel');
        if (chatPanel.contains(e.target) && currentUser) dropZone.classList.add('active');
    });
    document.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dragCounter--;
        if (dragCounter <= 0) { dropZone.classList.remove('active'); dragCounter = 0; }
    });
    document.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('active');
        dragCounter = 0;
        if (!currentUser) { alert('Войдите в систему'); return; }
        const files = e.dataTransfer
